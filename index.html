<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Odin Library</title>
        <link rel="stylesheet" href="styles.css">
        <script defer src="javascript.js"></script>
    </head>

    <body>
        <form class="form" action="" method="post">
            <h3>Add Book to Library</h3>
            <div class="entry">
                <label for="title">Book Title</label>
                <input id="title" name="title">
            </div>

            <div class="entry">
                <label for="author">Book Author</label>
                <input id="author" name="author">
            </div>

            <div class="entry">
                <label for="pages">How many pages does it have?</label>
                <input id="pages" name="pages">
            </div>

            <div class="entry">
                <label for="read">Have you read the book?</label>
                <input id="read" name="read">
            </div>
            <input class="submit-button" type="button" value="Add Book">

        </form>
        <div class="upper-container">
            <div class="container"></div>
        </div>
        

    </body>
</html>
